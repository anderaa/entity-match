name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy matching.py generate_data.py walkthrough.py
      # the end-to-end tests need the dataset; it is reproducible from the default seed
      - run: python generate_data.py --out data
      - run: pytest -q
